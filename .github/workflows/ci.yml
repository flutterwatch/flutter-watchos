name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  analyze-and-test:
    # The docs promise Xcode 26 or later. This image offers the first Xcode
    # 26 release (26.0.1) and defaults to 26.6. Branch protection requires
    # this job by its id, so keep the id.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The bootstrap clones the pinned Flutter SDK and compiles the tool
      # snapshot; cache it keyed on the pin so PR runs are fast.
      - name: Cache pinned Flutter SDK
        uses: actions/cache@v4
        with:
          path: flutter
          key: flutter-sdk-${{ runner.os }}-${{ hashFiles('bin/internal/flutter.version') }}

      - name: Bootstrap (pinned SDK + snapshot compile)
        run: ./bin/flutter-watchos --version

      # --fatal-infos so the analyzer gates a pull request the way the tests
      # do. Without it `dart analyze` exits 0 on infos, and a lint can sit in
      # the tree indefinitely while this step reports green.
      - name: Analyze
        run: ./flutter/bin/dart analyze --fatal-infos

      # Every test gets 2 s. A test that waits on a timer runs on fake time,
      # so a slower one is a bug, and it fails here rather than slowing
      # every run down.
      - name: Unit tests
        run: ./flutter/bin/dart test --timeout 2s test/general

      - name: Command tests
        run: ./flutter/bin/dart test --timeout 2s test/commands.shard/hermetic

  package:
    # The flutter_watchos package and its example, with the pinned SDK. The
    # CLI's own analyze leaves packages/ out (analysis_options.yaml), so this
    # job is where the package is analysed and tested.
    runs-on: macos-26
    timeout-minutes: 30
    # Reports without blocking on the release push: by then the package is
    # already on pub.dev, so a red run could stop nothing. The first commit
    # after the release tag sets this to false, and the job blocks from then
    # on.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Flutter SDK
        uses: actions/cache@v4
        with:
          path: flutter
          key: flutter-sdk-${{ runner.os }}-${{ hashFiles('bin/internal/flutter.version') }}

      - name: Bootstrap (pinned SDK + snapshot compile)
        run: ./bin/flutter-watchos --version

      - name: Package dependencies (from the lockfile)
        working-directory: packages/flutter_watchos
        run: $GITHUB_WORKSPACE/flutter/bin/flutter pub get --enforce-lockfile

      - name: Package analyze
        working-directory: packages/flutter_watchos
        run: $GITHUB_WORKSPACE/flutter/bin/flutter analyze --fatal-infos

      - name: Package tests
        working-directory: packages/flutter_watchos
        run: $GITHUB_WORKSPACE/flutter/bin/flutter test

      - name: Example analyze
        working-directory: packages/flutter_watchos/example
        run: $GITHUB_WORKSPACE/flutter/bin/flutter analyze --fatal-infos

      - name: Example tests
        working-directory: packages/flutter_watchos/example
        run: $GITHUB_WORKSPACE/flutter/bin/flutter test

      # No command above may leave a change behind: a dirty tree would also
      # put stray files into the package archive.
      - name: Tree unchanged
        run: |
          git status --short
          test -z "$(git status --short)"

      # Validates the package as pub.dev would. It reads pub.dev, like
      # fetching dependencies does; it is not a test, and it uploads nothing.
      - name: Publish dry run
        working-directory: packages/flutter_watchos
        run: |
          "$GITHUB_WORKSPACE/flutter/bin/flutter" pub publish --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"
          grep -qxF 'Package has 0 warnings.' "$RUNNER_TEMP/dry-run.txt"
