name: flutter_watchos
description: Platform detection and utilities for Flutter apps running on Apple Watch (watchOS). Provides runtime checks for watchOS, device info, capability queries, and Taptic Engine haptics.
version: 0.1.0
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/flutter-watchos
issue_tracker: https://github.com/flutterwatch/flutter-watchos/issues
documentation: https://flutterwatch.dev
topics:
  - watchos
  - apple-watch
  - wearable
  - ffi

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      watchos:
        ffiPlugin: true
        # C symbols this FFI plugin exports. This list documents them; it
        # does not keep them. They stay in the watch app, resolvable via
        # dlsym / DynamicLibrary.process(), because the flutter-watchos CLI
        # force-loads the plugin archive into the app, each export is marked
        # `used` + default-visibility (see
        # watchos/Classes/flutter_watchos_ffi.h), and the CLI keeps global
        # symbols through the App Store strip (STRIP_STYLE = non-global).
        ffiSymbols:
          - flutter_watchos_is_watchos
          - flutter_watchos_system_version
          - flutter_watchos_device_model
          - flutter_watchos_machine_id
          - flutter_watchos_is_simulator
          - flutter_watchos_screen_width
          - flutter_watchos_screen_height
          - flutter_watchos_screen_scale
          - flutter_watchos_play_haptic
          - flutter_watchos_available_memory
          - flutter_watchos_available_memory_supported
          - flutter_watchos_memory_footprint
          - flutter_watchos_status_bar_hidden
          - flutter_watchos_set_status_bar_hidden
          - flutter_watchos_always_on_active
          - flutter_watchos_set_always_on_active
          - flutter_watchos_always_on_supported
          - flutter_watchos_set_clock_band_height
          - flutter_watchos_clock_band_height
          - flutter_watchos_crown_mode
          - flutter_watchos_crown_set_mode
          - flutter_watchos_crown_push_delta
          - flutter_watchos_crown_consume_delta
