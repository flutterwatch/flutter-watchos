name: flutter_watchos
description: Flutter CLI tool for building and running Flutter apps on Apple Watch (watchOS). A custom embedder wrapping the Flutter SDK with watchOS-specific build targets, device management, and plugin support.
version: 0.1.2
homepage: https://flutterwatch.dev
repository: https://github.com/flutterwatch/flutter-watchos
publish_to: "none"

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  analyzer:
  archive:
  # The Dart hooks protocol, used directly rather than through flutter_tools'
  # translation layer: that layer maps flutter_tools' own closed set of target
  # platforms onto the protocol, and watchOS is not in it, so a build routed
  # through it introduces itself as iOS. Driving the protocol here is what lets
  # watchOS name itself — see lib/build_targets/watchos_hooks.dart.
  #
  # These ranges must keep admitting the exact versions flutter_tools pins, so
  # the tool resolves one copy of each, and the Flutter SDK checkout is never
  # patched (see bin/internal/shared.sh). flutter_tools pins code_assets 2.1.0
  # from Flutter 3.50.0 on (3.47.5 pinned 1.x), so the range is 2.x.
  code_assets: ^2.1.0
  data_assets: ^0.20.0
  hooks: ^2.0.2
  hooks_runner: ^1.5.0
  flutter_tools:
    path: flutter/packages/flutter_tools
  # The doctor's result types (ValidationResult and the rest), which
  # flutter_tools moved into this package of its own in Flutter 3.50. A path
  # into the pinned SDK, as flutter_tools itself resolves it.
  flutter_tools_core:
    path: flutter/packages/flutter_tools/packages/flutter_tools_core
  file:
  http:
  meta:
  package_config:
  path:
  process:
  pub_semver:
  unified_analytics:
  vm_service:
  yaml:

dev_dependencies:
  args:
  fake_async:
  file_testing:
  pubspec_parse:
  test:

dependency_overrides:
  meta: ^1.17.0
