name: saprobe
description: Safe-area probe for flutter-watchos. Logs MediaQuery's insets as SAFEAREA| lines, for tool/safe_area/check_insets.sh.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # The probe depends on the package in this repo, not on pub.dev, so that it
  # can report the clock band from WatchStatusBar.heightOf; it does not log
  # band= yet.
  flutter_watchos:
    path: ../../../packages/flutter_watchos

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
